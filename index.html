<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Erika Milevskaya</title>
    <meta name="description" content="Web-developer, about me, my works" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Space+Grotesk:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <link href="assets/icons/icon-planet.svg" rel="icon" />
    <link rel="stylesheet" href="src/styles/main.css" />
  </head>
  <body>
    <div id="root">
      <main>
        <section id="contacts" class="section">
          <div class="container">
            <h2>Contacts</h2>
            <div class="contacts-container">
              <div class="contacts__info">
                <p>
                  Feel free to reach out — I'd love to discuss your project or collaboration
                  opportunities.
                </p>
                <div class="contacts__items">
                  <a href="mailto:erika.milewska@gmail.com" target="_blank" class="link"
                    ><div class="contact__item">
                      <div class="contact__icon contact__icon_mail"></div>
                      <div class="contact__info">
                        <div class="contact__heading">Email</div>
                        <div class="contact__link">erika.milewska@gmail.com</div>
                      </div>
                    </div></a
                  >
                  <a href="https://github.com/rika-milew" target="_blank" class="link"
                    ><div class="contact__item">
                      <div class="contact__icon contact__icon_github"></div>
                      <div class="contact__info">
                        <div class="contact__heading">GitHub</div>
                        <div class="contact__link">github.com/rika-milew</div>
                      </div>
                    </div></a
                  >
                  <a href="https://github.com/rika-milew" target="_blank" class="link"
                    ><div class="contact__item">
                      <div class="contact__icon contact__icon_linkedin"></div>
                      <div class="contact__info">
                        <div class="contact__heading">LinkedIn</div>
                        <div class="contact__link">linkedin.com/in/rika-milew</div>
                      </div>
                    </div></a
                  >
                  <a href="https://t.me/rika_mee" target="_blank" class="link"
                    ><div class="contact__item">
                      <div class="contact__icon contact__icon_telegram"></div>
                      <div class="contact__info">
                        <div class="contact__heading">Telegram</div>
                        <div class="contact__link">@rika_mee</div>
                      </div>
                    </div></a
                  >
                </div>
              </div>
              <form id="contact-form" class="contact-form">
                <div class="form__item">
                  <label for="name">Name</label>
                  <input id="name" type="text" name="name" placeholder="Your name" required />
                </div>
                <div class="form__item">
                  <label for="email">Email</label>
                  <input id="email" type="email" name="email" placeholder="Email" required />
                </div>
                <div class="form__item">
                  <label for="message">Message</label>
                  <textarea
                    id="message"
                    name="message"
                    rows="5"
                    placeholder="Message..."
                    required
                    class="message-textarea"
                  ></textarea>
                </div>
                <button type="submit" class="button color-button">
                  <span class="button-icon"></span>Send message
                </button>
                <p id="form-status"></p>
              </form>
            </div>
          </div>
        </section>
      </main>
      <div class="modal" id="modal">
        <div id="close-icon" class="modal__content">
          <span class="close-icon"></span>
          <img src="assets/icons/check-icon.svg" alt="" class="modal-icon" />
          <p id="modal-heading"></p>
          <p id="modal-text"></p>
          <button id="modal-close" class="button color-button">Close</button>
        </div>
      </div>
    </div>
    <script type="module" src="src/scripts/index.js"></script>
  </body>
</html>
